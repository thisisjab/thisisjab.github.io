{{/*
  Template: Default Single Page Layout (layouts/_default/single.html)
  Purpose:  Renders standalone pages (such as /about/)
  Features: Title, optional TOC, and page content
*/}}
{{ define "main" }}
<article class="page">
    <h1>{{ .Title }}</h1>

    {{ if .Params.toc }}
        <aside {{ if .Params.tocBorder }}class="toc"{{ end }}>
            {{ .TableOfContents }}
        </aside>
    {{ end }}

    {{ .Content }}
</article>
{{ end }}
