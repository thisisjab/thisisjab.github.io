{{/*
  Template: Single Taxonomy Term Page (layouts/_default/term.html)
  Purpose:  Renders list of posts tagged with a specific keyword (e.g. /tags/go/)
*/}}
{{ define "main" }}
<div class="posts-page">
  <div class="posts-header">
    <h1 class="posts-title">#{{ .Title | lower }}</h1>
    <a href="{{ "/tags/" | relURL }}" class="posts-tags-link">[all tags]</a>
  </div>

  <div class="term-content">
    {{ partial "post_list.html" (dict "context" . "show_tags" false) }}
  </div>
</div>
{{ end }}
