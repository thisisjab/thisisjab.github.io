{{/*
  Partial: Image Lightbox (layouts/partials/lightbox.html)
  Purpose: Displays clicked images in a centered modal with dark blurry backdrop
*/}}
<div class="image-lightbox" id="image-lightbox" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="lightbox-backdrop"></div>
  <div class="lightbox-content">
    <img class="lightbox-image" src="" alt="" />
    <div class="lightbox-caption" style="display: none; color: rgba(255, 255, 255, 0.85); font-size: 0.85rem; margin-top: 0.5rem; text-align: center; max-width: 80vw;"></div>
    <button type="button" class="lightbox-close" aria-label="Close image overlay">[close]</button>
  </div>
</div>
<script>
  (function() {
    function initLightbox() {
      const lightbox = document.getElementById("image-lightbox");
      if (!lightbox) return;
      const lightboxImg = lightbox.querySelector(".lightbox-image");
      const lightboxCap = lightbox.querySelector(".lightbox-caption");
      const backdrop = lightbox.querySelector(".lightbox-backdrop");
      const closeBtn = lightbox.querySelector(".lightbox-close");

      function openLightbox(img) {
        lightboxImg.src = img.currentSrc || img.src;
        lightboxImg.alt = img.alt || "";
        const figcaption = img.closest("figure") ? img.closest("figure").querySelector("figcaption") : null;
        const captionText = figcaption ? figcaption.textContent.trim() : (img.alt && img.alt !== img.src ? img.alt : "");
        if (lightboxCap) {
          if (captionText) {
            lightboxCap.textContent = captionText;
            lightboxCap.style.display = "block";
          } else {
            lightboxCap.style.display = "none";
          }
        }
        lightbox.classList.add("active");
        lightbox.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      }

      function closeLightbox() {
        lightbox.classList.remove("active");
        lightbox.setAttribute("aria-hidden", "true");
        lightboxImg.src = "";
        if (lightboxCap) lightboxCap.style.display = "none";
        document.body.style.overflow = "";
      }

      document.querySelectorAll("article.post img, .page-content img:not(.home-avatar), .gallery-item img").forEach(img => {
        img.addEventListener("click", () => openLightbox(img));
      });

      backdrop.addEventListener("click", closeLightbox);
      closeBtn.addEventListener("click", closeLightbox);
      lightboxImg.addEventListener("click", closeLightbox);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && lightbox.classList.contains("active")) {
          closeLightbox();
        }
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initLightbox);
    } else {
      initLightbox();
    }
  })();
</script>
