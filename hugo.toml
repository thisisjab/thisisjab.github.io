baseURL = 'https://thisisjab.github.io/'
locale = 'en-us'
title = 'Jab'
theme = 'minimal'

taxonomies = { tag = "tags" }


[markup]
  [markup.highlight]
    codeFences         = true
    anchorLineNos = true
    guessSyntax        = false
    lineNos            = true 
    lineNumbersInTable = false 
    noClasses          = false 
    hl_inline = false 
    style = 'catppuccin-mocha'

  [markup.tableOfContents]
    startLevel = 1
    endLevel   = 3
    ordered    = false

[params]
  style = "css/main.scss"

  [params.theme_config]
    appearance        = "auto"
    back_home_text    = "<<<"
    date_format       = "2006-01-02"
    isListGroupByDate = false
    isShowFooter      = true
    footer_now        = "Exploring distributed systems and AI"
    links_title       = "Links"
    # Table of Contents: true to enable globally for blog posts, false to disable.
    # Can be overridden per post with 'toc = true' or 'toc = false' in post frontmatter.
    toc               = true
    # Optional status badge (leave empty or commented to disable):
    # status          = "open to work"
    # Optional default location:
    # location        = "Iran"
    # Optional color overrides:
    # subheading_color = "#d4d4d4"
    # heading_color    = "#ffffff"
